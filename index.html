<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Cipher App</title>
        <link rel="stylesheet" href="app.css">
    </head>
    <body>
        <h1>Cipher App</h1>
        <label>Select Cipher:</label>
        <select id="cipherSelect">
            <option value="caesar">Caesar</option>
            <option value="affine">Affine</option>
            <option value="vigenere">Vigenere</option>
            <option value="playfair">Playfair</option>
        </select>
        <div id="caesarKeys">
            <label>Shift:</label>
            <input type="number" id="caesarShift" value="3">
        </div>
        <div id="affineKeys">
            <label>Key A:</label>
            <input type="number" id="affineA" value="5">
            <label>Key B:</label>
            <input type="number" id="affineB" value="8">
        </div>
        <div id="vigenereKeys">
            <label>Keyword:</label>
            <input type="text" id="vigenereKey" value="LEMON">
        </div>
        <div id="playfairKeys">
            <label>Keyword:</label>
            <input type="text" id="playfairKey" value="SECRETKEY">
        </div>
        <button id="resetKeysBtn" class="secondary">Reset Keys</button>
        <label>Input Text:</label>
        <textarea id="input" rows="4"></textarea>
        <button id="encryptBtn">Encrypt</button>
        <button id="decryptBtn">Decrypt</button>
        <button id="clearInputBtn" class="secondary">Clear Input</button>
        <button id="clearResultBtn" class="secondary">Clear Result</button>
        <p>Result:</p>
        <div id="outputContainer">
            <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E3B19" stroke-width="2">
                <rect x="9" y="2" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <textarea id="output" rows="4" readonly></textarea>
        </div>
        <p id="copyright">© 2026 Jasmine Sweetman. All rights reserved.</p>
        <script src="cipher.js"></script>
        <script src="app.js"></script>
    </body>
</html>
